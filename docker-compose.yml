services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared-network
      
      
      
networks:
  shared-network:
    external: true
    name: shared-network